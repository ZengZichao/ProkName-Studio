name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  # The engine ProkName Studio depends on, as a published source rather than a
  # local path. If the engine repository is private, point this at a
  # token-authenticated URL held in a repository secret instead.
  PROKNAME_SOURCE: git+https://github.com/ZengZichao/ProkName.git@main

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install ruff
        run: python -m pip install ruff

      - name: Ruff check
        run: ruff check src tests conftest.py

  test:
    name: Test (${{ matrix.os }} / Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.11', '3.12', '3.13', '3.14']

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install the engine this front end depends on
        # `$PROKNAME_SOURCE` expands only in bash: the Windows default shell is
        # PowerShell, which needs `$env:`, so the bare form silently expanded to
        # nothing, the engine install "succeeded" having installed nothing, and
        # the next step looked for `prokname>=0.1.0` on an index that does not
        # carry it. bash also makes the multi-line continuations below valid.
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install "$PROKNAME_SOURCE"

      - name: Install the system libraries Qt loads on Linux
        # PySide6 links against libEGL / libGL at import time and the ubuntu
        # runner image does not ship them, so every Qt case died with
        # `ImportError: libEGL.so.1` before one of them ran. Offscreen rendering
        # removes the need for a display server, not the need for the libraries.
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon-x11-0 libdbus-1-3 libfontconfig1

      - name: Install Studio with its dev toolchain
        run: pip install -e ".[dev]"

      - name: Run the suite (with coverage)
        # No display on a runner: offscreen keeps QApplication usable.
        # --cov-fail-under is the floor, not the measurement: the suite runs at
        # 90% line coverage (2026-09-29), and the number below exists so a drop
        # that removes tests (or adds untested branches) fails the run instead of
        # being admired in the term-missing report.
        env:
          QT_QPA_PLATFORM: offscreen
        shell: bash
        run: |
          python -m pytest -v --tb=short \
            --cov=prokname_studio --cov-report=term-missing --cov-report=xml \
            --cov-fail-under=85 --junitxml=results.xml

      - name: Assert the Qt-backed suite actually ran
        # The engine repository used to skip the whole GUI suite when the optional
        # extra was absent, and a skipped gate is not a gate. PySide6 is a runtime
        # dependency here, so nothing may skip for a missing Qt: a run that skipped
        # is a broken install and has to go red. Parsed from the JUnit XML rather
        # than scraped from stdout, because pytest's summary line disappears at
        # high -q verbosity (this repository's addopts already carry -q).
        env:
          QT_QPA_PLATFORM: offscreen
        shell: bash
        run: |
          python - <<'PY'
          import sys
          import xml.etree.ElementTree as ET

          cases = list(ET.parse("results.xml").getroot().iter("testcase"))
          qt_skips = [
              c for c in cases
              if c.find("skipped") is not None
              and any(word in (c.find("skipped").get("message") or "")
                      for word in ("PySide6", "pytestqt", "pytest-qt"))
          ]
          print(f"Studio cases collected: {len(cases)}, skipped for a missing "
                f"Qt dependency: {len(qt_skips)}")
          # 245 is what this suite holds (measured 2026-09-29); the floor is deliberately
          # lower so adding cases never breaks it, but a whole file that stops being
          # collected (renamed, unimportable, deselected) does.
          if len(cases) < 150:
              print(f"FAIL: expected the suite (~245 cases), got {len(cases)} — "
                    "a tests/ file is not being collected")
              sys.exit(1)
          if qt_skips:
              print("FAIL: Studio cases skipped despite Qt being a runtime dependency:")
              for case in qt_skips[:10]:
                  print("  ", case.get("classname"), case.get("name"))
              sys.exit(1)
          print("OK: the suite executed with Qt available")
          PY

  wheel:
    name: Wheel build + install smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Build wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel

      - name: Install the system libraries Qt loads on Linux
        # PySide6 links against libEGL / libGL at import time and the ubuntu
        # runner image does not ship them, so every Qt case died with
        # `ImportError: libEGL.so.1` before one of them ran. Offscreen rendering
        # removes the need for a display server, not the need for the libraries.
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon-x11-0 libdbus-1-3 libfontconfig1

      - name: Install wheel into a clean venv and smoke-test
        # `$PROKNAME_SOURCE` expands only in bash: the Windows default shell is
        # PowerShell, which needs `$env:`, so the bare form silently expanded to
        # nothing, the engine install "succeeded" having installed nothing, and
        # the next step looked for `prokname>=0.1.0` on an index that does not
        # carry it. bash also makes the multi-line continuations below valid.
        shell: bash
        run: |
          python -m venv /tmp/studio-smoke
          /tmp/studio-smoke/bin/pip install --upgrade pip
          /tmp/studio-smoke/bin/pip install "$PROKNAME_SOURCE"
          /tmp/studio-smoke/bin/pip install dist/*.whl
          # An editable install can hide missing package data; the wheel must
          # ship assets/icon.svg, or the app opens without its own icon.
          QT_QPA_PLATFORM=offscreen /tmp/studio-smoke/bin/python - <<'PY'
          import prokname_studio
          from PySide6.QtWidgets import QApplication
          from prokname_studio import icons

          # A QPixmap cannot be constructed before a QGuiApplication exists, and
          # app_icon() returns one. Without this line the smoke test aborts the
          # interpreter (exit 134) instead of reporting anything about the wheel —
          # the real application constructs QApplication first, so only this check
          # had the ordering wrong.
          qt_app = QApplication([])

          print("studio", prokname_studio.__version__,
                "engine", __import__("prokname").__version__)
          assert icons.icon_svg().startswith(b"<?xml"), "the icon did not ship"
          assert icons.has_svg_handler(), "no SVG handler in the wheel's Qt"
          assert not icons.app_icon().isNull(), "the app icon is empty"
          PY
          /tmp/studio-smoke/bin/prokname-studio --version

      - uses: actions/upload-artifact@v4
        with:
          name: wheel
          path: dist/*.whl

  bundle:
    name: PyInstaller bundle vs source module set
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Studio with its build deps
        # `$PROKNAME_SOURCE` expands only in bash: the Windows default shell is
        # PowerShell, which needs `$env:`, so the bare form silently expanded to
        # nothing, the engine install "succeeded" having installed nothing, and
        # the next step looked for `prokname>=0.1.0` on an index that does not
        # carry it. bash also makes the multi-line continuations below valid.
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install "$PROKNAME_SOURCE"
          pip install -e ".[build]"

      - name: Generate the shell icon from the SVG
        # The .icns is a build product, not a committed asset: one piece of
        # artwork, everything else derived. Without this step the bundle would
        # build fine and ship the platform's generic tile.
        run: python scripts/make_bundle_icon.py

      - name: Build .app bundle
        run: pyinstaller ProkNameStudio.spec --noconfirm

      - name: Verify PYZ module set matches source (stale-bundle guard)
        run: |
          python - <<'PY'
          from pathlib import Path
          from PyInstaller.archive.readers import CArchiveReader

          exe = next(Path("dist").glob("*.app/Contents/MacOS/*"))
          z = CArchiveReader(str(exe)).open_embedded_archive("PYZ.pyz")
          bundled = {m for m in z.toc
                     if m.startswith("prokname_studio")}
          src = Path("src")
          expected = set()
          for p in src.rglob("*.py"):
              mod = ".".join(p.with_suffix("").relative_to(src).parts)
              if mod.endswith(".__init__"):
                  mod = mod[: -len(".__init__")]
              expected.add(mod)
          missing = sorted(expected - bundled)
          assert not missing, f"stale bundle — modules missing from PYZ: {missing}"
          assert "prokname" in {m for m in z.toc}, (
              "the engine this app drives is not in the bundle at all")
          print(f"bundle OK: {len(bundled)} prokname_studio modules match source")
          PY

      - name: Verify the icon asset reached the bundle
        # onedir puts binaries and datas on disk under Contents/, not inside the
        # CArchive the module check above reads — so this looks at the filesystem.
        # A missing asset is exactly the failure that only appears on the user's
        # machine, where the window opens with the platform's generic tile.
        run: |
          python - <<'PY'
          from pathlib import Path

          root = next(Path("dist").glob("*.app/Contents"))
          icon = root / "Resources" / "prokname_studio" / "assets" / "icon.svg"
          assert icon.is_file(), f"{icon} is not in the bundle"
          assert icon.read_bytes().startswith(b"<?xml"), "the shipped icon is truncated"
          engine_rules = root / "Resources" / "prokname" / "data" / "rules.json"
          assert engine_rules.is_file(), f"{engine_rules} is not in the bundle"
          svg_plugins = [p.name for p in (root / "Frameworks").rglob("*qsvg*")]
          assert svg_plugins, (
              "no Qt SVG plugin in the bundle: the app would fall back to the "
              f"degraded glyph (looked for *qsvg*, found {svg_plugins})")
          # The shell icon is a separate thing from the window icon: Info.plist
          # must name the .icns the spec embedded, and that file must be in the
          # bundle. Otherwise Finder and the Dock show PyInstaller's default tile
          # and nothing here says so.
          plist = (root / "Info.plist").read_bytes()
          assert b"ProkNameStudio.icns" in plist, (
              "Info.plist does not name ProkNameStudio.icns — the bundle shipped "
              "the generic shell icon")
          shell = root / "Resources" / "ProkNameStudio.icns"
          assert shell.is_file() and shell.stat().st_size > 10_000, shell
          print(f"icon OK: {icon.name} + {engine_rules.name} + {shell.name} "
                f"+ plugins {svg_plugins}")
          PY

      - name: Smoke-test the frozen app
        # The bundle is only "built" if it starts. --version exercises the frozen
        # import graph (prokname_studio + prokname + PySide6) and exits; then the
        # window is opened for real and must still be alive a few seconds later —
        # a GUI that dies on first paint has no exit code to report.
        run: |
          exe="$(pwd)/$(ls -d dist/*.app)/Contents/MacOS/ProkNameStudio"
          "$exe" --version
          "$exe" --theme dark &
          app_pid=$!
          sleep 8
          if kill -0 "$app_pid" 2>/dev/null; then
            echo "OK: the frozen window stayed up"
            kill "$app_pid"
          else
            echo "FAIL: the frozen app exited within 8s"
            exit 1
          fi
